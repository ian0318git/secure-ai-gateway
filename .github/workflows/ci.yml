name: lint-and-test

# Mirrors the local pre-commit gate (.githooks/pre-commit) on the
# server side: ruff, mypy, bandit, dependency audit, full test suite.
# Fail closed — any check failing reds the run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (incl. zh_core_web_lg, ~575MB)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src tests scripts

      - name: mypy
        run: mypy src

      - name: bandit
        run: bandit -q -r src

      - name: pip-audit
        run: pip-audit

      - name: pytest (unit + security + fast bench)
        run: pytest tests -q
